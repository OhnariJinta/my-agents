version: 1
name: generic-subagent-harness
description: 汎用タスク向け subAgent オーケストレーション

personas:
  - id: orchestrator
    role: 全体統制・優先順位制御・エスカレーション
  - id: planner
    role: 要件分解・実行計画化・リスク見積り
  - id: executor
    role: 実装・調査・検証作業
  - id: auditor
    role: 品質/セキュリティ/ライセンス観点監査
  - id: recorder
    role: 意思決定・作業ログ・成果物記録

workflow:
  - step: intake
    owner: orchestrator
    output: task_brief
  - step: plan
    owner: planner
    output: execution_plan
  - step: execute
    owner: executor
    output: deliverables
  - step: audit
    owner: auditor
    output: audit_report
  - step: record
    owner: recorder
    output: run_log
  - step: close
    owner: orchestrator
    output: final_summary

rules:
  - 環境作成前に security policy を必ず確認する
  - 90日クールダウン対象や厳格ライセンス依存は許可取得まで保留する
  - 監査未完了の成果物は完了扱いにしない
